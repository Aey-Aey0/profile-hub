<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="style.css">
  <title>>Responsive Music Profile Card</title>
</head>
<body>
  <div class="grid">
    <article class="pfp-card">
      <div class="image-card">
        <img class="pfp-card__photo" src="pfp-img.jpg">
      </div>
      <h2 class="pfp-card__name">Lin Zhixia</h2>
      <p class="pfp-card__role">Software Engineer</p>
    </article>
    
    <div class="theme-card">
      <label class="mode-switch" for="theme-toggle">
        <input type="checkbox" id="theme-toggle">
        <span class="mode-switch__knob" aria-hidden="true"></span>
        <span class="mode-switch__label">Dark mode</span>
        <span class="mode-switch__status" aria-live="polite">Off</span>
      </label>
    </div>
    <a class="listen-card listen-card--spotify" href="#">
      <span class="listen-card__icon" aria-hidden="true">▶</span>
      <span class="listen-card__content">
        <span class="listen-card__title">Listen on Spotify</span>
        <span class="listen-card__stat">2.1M monthly</span>
      </span>
    </a>
    
    <a class="listen-card listen-card--youtube" href="#">
      <span class="listen-card__icon" aria-hidden="true">▶</span>
      <span class="listen-card__content">
        <span class="listen-card__title">Watch on YouTube</span>
        <span class="listen-card__stat">New video</span>
      </span>
    </a>
    <a class="social-card social-card--instagram" href="#">
      <span class="social-card__icon" aria-hidden="true">▶</span>
      <span class="listen-card__name">Instagram</span>
    </a>
    <a class="social-card social-card--tiktok" href="#">
      <span class="social-card__icon" aria-hidden="true">▶</span>
      <span class="listen-card__name">Tiktok</span>
    </a>
    
    <form class="newsletter">
      <label class="newsletter__label" for="email-input">Monthly mixtape, no spam</label>
      <div class="newsletter__row">
        <input class="newsletter__input" id="email-input" type="email" name="email" placeholder="you@email.com" required>
        <button class="newsletter__button" type="submit">Join</button>
      </div>
    </form>

     
   


  </div>
  <script src="script.js"></script>
</body>
</html>
